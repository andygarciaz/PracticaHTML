    <!-- 2. Link al archivo CSS personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="index.html">Mi Sitio Web</a>
    <!-- Este botón es el que aparece en celulares (menú de hamburguesa) -->

      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Login</a>

        <li class="nav-item">

    <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow"> <!-- Esto crea un cuadro con sombra -->
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Username:</label>
                            <!-- form-control hace que la caja de texto se vea moderna -->
                            <input type="text" class="form-control" name="username" placeholder="Ingresa tu usuario">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password:</label>
                            <input type="password" class="form-control" name="password" placeholder="Ingresa tu contraseña">
                        </div>
                        <div class="d-grid">
                            <!-- Clases de Bootstrap para un botón atractivo -->
                            <button type="submit" class="btn btn-primary">Entrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
