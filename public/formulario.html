<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Formulario Interactivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mi Sitio Web</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Mi Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" href="formulario.html">Formulario</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Formulario Interactivo</h2>
        
        <!-- Requisito 1: Radio buttons para mostrar contenido -->
        <div class="mb-4 p-3 border rounded">
            <h4>1. Mostrar/Ocultar</h4>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="opcionesRadio" id="radioMostrar">
                <label class="form-check-label">Mostrar mensaje</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="opcionesRadio" id="radioOcultar" checked>
                <label class="form-check-label">Ocultar mensaje</label>
            </div>
            <div id="contenidoOculto" class="mt-3 alert alert-success" style="display: none;">
                ¡Contenido revelado correctamente!
            </div>
        </div>

        <!-- Requisito 2: Menús desplegables (Dropdowns) -->
        <div class="mb-4 p-3 border rounded">
            <h4>2. Selección de País y Región</h4>
            <select id="pais" class="form-select mb-2">
                <option value="">Selecciona un país...</option>
            </select>
            <select id="region" class="form-select">
                <option value="">Selecciona una región...</option>
            </select>
        </div>

        <!-- Requisito 3: Checkboxes para activar botón -->
        <div class="mb-4 p-3 border rounded">
            <h4>3. Aceptar términos</h4>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="check1">
                <label class="form-check-label">Acepto los términos</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="check2">
                <label class="form-check-label">Acepto las condiciones</label>
            </div>
            <button id="btnActivar" class="btn btn-primary mt-3" disabled>Continuar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
